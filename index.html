<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marissa - Links</title>
  <style>
  html {
    min-height: 100%;
  }
  body {
    min-height: 100%;
    margin: 0;
    padding-top: 40px;
    padding-bottom: 40px;
    background: linear-gradient(
      180deg,
      rgba(198, 57, 131, 1),
      rgba(252, 220, 240, 1)
    );
    color: rgba(252, 220, 240, 1);
    font-family: "Impact";
  }

  .main-container {
    max-width: 640px;
    margin: auto;
  }

  .image-row {
    margin-bottom: 20px;
    text-align: center;
  }

  .avatar-image {
    width: 128px;
    height: 128px;
    object-fit: cover;
    border-radius: 128px;
  }

  .name-row {
    font-family: "Georgia";
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 30px;
    text-align: center;
    color: rgba(252, 220, 240, 1);
  }

  .social-icons-row {
    margin-bottom: 30px;
    display: flex;
    justify-content: space-around;
  }

  .links-row .item {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .thumbnail {
    width: 48px;
    height: 48px;
    border-radius: 48px;
    object-fit: cover;
  }

  .link-text {
    flex-grow: 1;
    text-align: center;
    text-decoration: none;
    color: rgba(252, 220, 240, 1);
    font-weight: 600;
  }

  .item {
    background-color: rgba(198, 57, 131, 0.8);
    border-radius: 1000px;
    padding: 10px 20px;
    box-shadow: 4px 4px 12px 0px rgba(198, 57, 131, 0.5);
    transition: background 0.3s ease;
  }

  .item:hover {
    background-color: rgba(226, 66, 157, 0.9);
  }
</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
</head>
<body>
  <div class="main-container">

    <div class="image-row">
      <img class="avatar-image" src="thumbnails/linkedin pic.jpeg" alt="Marissa">
    </div>

    <div class="name-row">
      Marissa
    </div>

    <div class="social-icons-row">
      <a href="https://www.instagram.com/marissacfadely/" target="_blank" class="link-text"> <i class="fa-brands fa-instagram"></i> </a>
      <a href="https://www.linkedin.com/in/marissafadely/" target="_blank" class="link-text">LinkedIn <i class="fa-brands fa-linkedin"></i> </a>
    </div>

    <div class="links-row">
      <div class="item">
        <img class="thumbnail" src="thumbnails/StarBattles.jpeg" alt="My Favorite Game">
        <a target="_blank" href="https://starbattle.puzzlebaron.com/" class="link-text">
          My Favorite Game
        </a>
      </div>

    </div>
  </div>
</body>
</html>
